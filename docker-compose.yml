services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pawtrace}
      MYSQL_USER: ${MYSQL_USER:-pawtrace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pawtrace_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pawtrace_local_root_password}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [pawtrace]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-pawtrace}:${MYSQL_PASSWORD:-pawtrace_local_password}@mysql:3306/${MYSQL_DATABASE:-pawtrace}
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pawtrace]
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [pawtrace]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${APP_PORT:-8081}:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
    networks: [pawtrace]
volumes:
  mysql_data:
networks:
  pawtrace:
